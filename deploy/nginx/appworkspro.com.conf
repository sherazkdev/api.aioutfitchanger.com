# AI Wardrobe — https://appworkspro.com → 127.0.0.1:3020
# After copy: sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d appworkspro.com -d www.appworkspro.com

upstream ai_outfit_changer {
    server 127.0.0.1:3020;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name appworkspro.com www.appworkspro.com;

    client_max_body_size 25m;

    access_log /var/log/nginx/appworkspro.com.access.log;
    error_log /var/log/nginx/appworkspro.com.error.log;

    location / {
        proxy_pass http://ai_outfit_changer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
